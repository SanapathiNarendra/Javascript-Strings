<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed and Precision</title>
    <script src="FixedAndPrecision.js" defer></script>
</head>
<body>
    <h1>Fixed and Precision</h1>
    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" >   
    <button onclick="onclickFixed()">Display Fixed </button>
    <p id="result"></p>

    <label for="precisionInput">Enter precision value:</label>
    <input type="number" id="precisionInput" step="any">
    <button onclick="onclickPrecision()">Display Precision</button>
    <p id="precisionResult"></p>


</body> 
    
</body>
</html>
